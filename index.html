<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beetle Sweet | بطاقة الكافيه الذكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card-container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 126, 14, 0.3);
            border-radius: 28px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        .logo-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #ff7e0e;
            box-shadow: 0 0 20px rgba(255, 126, 14, 0.4);
            background: #fff;
        }
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 5px;
            color: #ff7e0e;
            letter-spacing: 1px;
        }
        p.location {
            font-size: 13px;
            color: #38bdf8;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            line-height: 1.5;
        }
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
            color: #ffffff;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .link-btn:hover {
            transform: translateY(-3px);
            border-color: #ff7e0e;
            background: rgba(255, 126, 14, 0.15);
        }
        .link-btn.whatsapp:hover { border-color: #25D366; background: rgba(37, 211, 102, 0.15); }
        .link-btn.instagram:hover { border-color: #E1306C; background: rgba(225, 48, 108, 0.15); }
        .link-btn.facebook:hover { border-color: #1877F2; background: rgba(24, 119, 242, 0.15); }

        .link-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .link-btn i {
            font-size: 22px;
        }
        .whatsapp i { color: #25D366; }
        .instagram i { color: #E1306C; }
        .facebook i { color: #1877F2; }
        .location-icon i { color: #ff7e0e; }

        .arrow {
            font-size: 14px;
            color: #94a3b8;
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #64748b;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- شعار الكافيه -->
        .logo-container {
            <img src="BEETLE.PNJ.jfif" alt="Beetle Sweet Logo" id="c-logo">
        </div>
        
        <!-- اسم الكافيه -->
        <h1>BEETLE SWEET</h1>
        
        <!-- العنوان -->
        <p class="location">
            <i class="fa-solid fa-location-dot"></i>
            قلقيلية - شارع الاستخبارات العسكرية - خلف حديقة الحيوانات
        </p>
        
        <!-- أزرار التواصل المباشر -->
        <div class="links-list">
            <!-- رابط الواتساب المباشر -->
            <a href="https://wa.me/972566800919" class="link-btn whatsapp" target="_blank">
                <div class="link-content">
                    <i class="fa-brands fa-whatsapp"></i>
                    <span>مراسلة عبر الواتساب</span>
                </div>
                <i class="fa-solid fa-angle-left arrow"></i>
            </a>

            <!-- رابط إنستغرام المباشر -->
            <a href="https://instagram.com/beetle._sweet" class="link-btn instagram" target="_blank">
                <div class="link-content">
                    <i class="fa-brands fa-instagram"></i>
                    <span>تابعنا على إنستغرام</span>
                </div>
                <i class="fa-solid fa-angle-left arrow"></i>
            </a>

            <!-- رابط الفيسبوك المباشر الذي أرسلته -->
            <a href="https://www.facebook.com/share/1DQ4Hu1Gde/?mibextid=wwXIfr" class="link-btn facebook" target="_blank">
                <div class="link-content">
                    <i class="fa-brands fa-facebook"></i>
                    <span>صفحة الفيسبوك</span>
                </div>
                <i class="fa-solid fa-angle-left arrow"></i>
            </a>

            <!-- زر الموقع على الخريطة -->
            <a href="https://maps.google.com/?q=Qalqilya+Zoo" class="link-btn location-icon" target="_blank">
                <div class="link-content">
                    <i class="fa-solid fa-map-location-dot"></i>
                    <span>موقعنا على الخريطة</span>
                </div>
                <i class="fa-solid fa-angle-left arrow"></i>
            </a>
        </div>

        <div class="footer">
            Smart NFC Digital Card ⚡
        </div>
    </div>

</body>
</html>
